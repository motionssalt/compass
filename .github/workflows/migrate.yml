name: D1 migrations

# Runs the D1 migration set on every push to main so schema changes
# ship automatically. Cloudflare's GitHub integration handles the
# Worker code deploy separately — this workflow only touches D1.

on:
  push:
    branches: [main]
    paths:
      - 'migrations/**'
      - 'wrangler.toml'
      - '.github/workflows/migrate.yml'
  workflow_dispatch: {}

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm install

      - name: Apply D1 migrations (remote)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply motionsalt_compass --remote
