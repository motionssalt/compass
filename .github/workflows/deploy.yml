name: Deploy Worker

# Runs on every push to main. Applies any pending D1 migrations and
# then deploys the Worker code itself with `wrangler deploy`. This
# workflow fully owns deployment — Cloudflare's "Deploy from Git"
# integration is no longer used (it was hitting a stale build-token
# bug), so this job is the single source of truth for shipping both
# schema changes and Worker code.
#
# If the migration step fails, the deploy step is skipped so we never
# ship code against a database that isn't on the expected schema.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm install

      - name: Apply D1 migrations (remote)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply motionsalt_compass --remote

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
